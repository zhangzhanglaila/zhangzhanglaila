<svg width="760" height="300" viewBox="0 0 760 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="zhangzhanglaila — AI agent engineer, built to run in production">
  <title>zhangzhanglaila · built to run in production</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070C"/>
      <stop offset="0.55" stop-color="#080D17"/>
      <stop offset="1" stop-color="#05070C"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="760" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5AE9C8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#8FB4FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF9BB4" stop-opacity="0.42"/>
    </linearGradient>

    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0.4">
      <stop stop-color="#8DF7DC"/>
      <stop offset="0.48" stop-color="#9CC0FF"/>
      <stop offset="1" stop-color="#FFA2B8"/>
    </linearGradient>

    <linearGradient id="rule" x1="48" y1="0" x2="470" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="gridFade" cx="0.36" cy="0.38" r="0.78">
      <stop stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.12" r="0.95">
      <stop stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="core" cx="0.35" cy="0.3" r="0.85">
      <stop stop-color="#12202F"/>
      <stop offset="1" stop-color="#080F19"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <filter id="aurora" x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="56"/>
    </filter>

    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <mask id="gridMask">
      <rect width="760" height="300" fill="url(#gridFade)"/>
    </mask>

    <clipPath id="card">
      <rect width="760" height="300" rx="24"/>
    </clipPath>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .display { font-family: -apple-system, "Segoe UI Variable Display", "Segoe UI", Inter, "Helvetica Neue", Roboto, Arial, sans-serif; }
      .kicker { fill: #5AE9C8; font-size: 10px; font-weight: 600; letter-spacing: 3.2px; }
      .brand { fill: #93A3B6; font-size: 12.5px; letter-spacing: 0.6px; }
      .meta { fill: #7C8CA1; font-size: 11px; letter-spacing: 0.9px; }
      .h1 { fill: #F3F7FB; font-size: 46px; font-weight: 700; letter-spacing: -0.9px; }
      .h2 { font-size: 46px; font-weight: 700; letter-spacing: -0.9px; fill: url(#word); filter: drop-shadow(0 6px 22px rgba(143, 180, 255, 0.22)); }
      .spec-key { fill: #5AE9C8; font-size: 8px; font-weight: 600; letter-spacing: 1.6px; }
      .spec-val { fill: #9CADC0; font-size: 9.5px; letter-spacing: 0.5px; }
      .node { fill: #0B1521; fill-opacity: 0.92; stroke: #FFFFFF; stroke-opacity: 0.1; }
      .node-hot { fill: #0C1A24; stroke: #5AE9C8; stroke-opacity: 0.4; }
      .node-label { fill: #A7B6C7; font-size: 8px; letter-spacing: 1.1px; }
      .node-label-hot { fill: #DFF2EC; font-size: 8.5px; font-weight: 600; letter-spacing: 1.3px; }
      .fig { fill: #64748B; font-size: 7.5px; letter-spacing: 1.8px; }
      .tick { stroke: #FFFFFF; stroke-opacity: 0.08; }
      .wire { stroke: #FFFFFF; stroke-opacity: 0.13; }
      .wire-hot { stroke: #5AE9C8; stroke-opacity: 0.25; }
      .drift-a { animation: driftA 22s ease-in-out infinite; }
      .drift-b { animation: driftB 27s ease-in-out infinite; }
      .drift-c { animation: driftC 31s ease-in-out infinite; }
      .sweep { animation: sweep 11s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      @keyframes driftA { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(26px, -18px); } }
      @keyframes driftB { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-30px, 16px); } }
      @keyframes driftC { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(16px, 20px); } }
      @keyframes sweep {
        0% { transform: translateX(-640px); opacity: 0; }
        8% { opacity: 1; }
        48%, 100% { transform: translateX(1220px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .drift-a, .drift-b, .drift-c, .sweep { animation: none; }
      }
    </style>
  </defs>

  <rect width="760" height="300" rx="24" fill="url(#bg)"/>

  <g clip-path="url(#card)">
    <ellipse class="drift-a" cx="112" cy="296" rx="280" ry="168" fill="#0EA5A0" opacity="0.24" filter="url(#aurora)"/>
    <ellipse class="drift-b" cx="700" cy="44" rx="236" ry="148" fill="#4F46E5" opacity="0.3" filter="url(#aurora)"/>
    <ellipse class="drift-c" cx="440" cy="332" rx="220" ry="120" fill="#E11D48" opacity="0.13" filter="url(#aurora)"/>

    <rect width="760" height="300" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect width="760" height="300" fill="url(#vignette)"/>

    <g transform="rotate(16 380 150)">
      <rect class="sweep" x="-70" y="-120" width="140" height="500" fill="url(#sweepGrad)" opacity="0.06"/>
    </g>

    <rect width="760" height="300" filter="url(#noise)" opacity="0.035"/>
  </g>

  <rect x="0.5" y="0.5" width="759" height="299" rx="24" stroke="url(#edge)" stroke-opacity="0.55"/>
  <path d="M64 1H696" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <g class="tick" stroke-width="1" fill="none">
    <path d="M34 46V34H46"/>
    <path d="M714 34H726V46"/>
    <path d="M726 254V266H714"/>
    <path d="M46 266H34V254"/>
  </g>

  <g>
    <rect x="48" y="26" width="32" height="32" rx="9" fill="#0B1422" stroke="url(#edge)" stroke-opacity="0.7"/>
    <text class="mono display" x="64" y="47" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="0.5" fill="#EAF7F3">ZL</text>
    <text class="mono brand" x="92" y="45">zhangzhanglaila</text>

    <circle cx="592" cy="42" r="3" fill="#4ADE80"/>
    <circle cx="592" cy="42" r="4" fill="none" stroke="#4ADE80" stroke-opacity="0.55">
      <animate attributeName="r" values="3.5;10" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.55;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text class="mono meta" x="712" y="45" text-anchor="end">WUHAN / UTC+8</text>
  </g>

  <text class="mono kicker" x="48" y="100">AI AGENT ENGINEER / PYTHON / LLM</text>
  <text class="display h1" x="48" y="146">Built to run</text>
  <text class="display h2" x="48" y="192">in production.</text>

  <path d="M48 212H300" stroke="url(#rule)" stroke-width="1"/>

  <g class="mono">
    <text class="spec-key" x="48" y="230">STACK</text>
    <text class="spec-val" x="108" y="230">python / typescript / vue / sqlite</text>
    <text class="spec-key" x="48" y="249">INFRA</text>
    <text class="spec-val" x="108" y="249">fastapi / docker / linux / git</text>
    <text class="spec-key" x="48" y="268">FOCUS</text>
    <text class="spec-val" x="108" y="268">agents / video pipelines / local-first</text>
  </g>

  <g transform="translate(0 12)">
  <text class="mono fig" x="536" y="76">FIG. 01 / REQUEST PATH</text>

  <g class="mono">
    <path class="wire" d="M626 112V140"/>
    <path class="wire" d="M626 174V196"/>
    <path class="wire" d="M556 196H696"/>
    <path class="wire" d="M556 196V212"/>
    <path class="wire-hot" d="M626 196V212"/>
    <path class="wire" d="M696 196V212"/>
  </g>

  <path d="M622.5 131H629.5L626 135.5Z" fill="#FFFFFF" fill-opacity="0.2"/>
  <path d="M622.5 186.5H629.5L626 191Z" fill="#FFFFFF" fill-opacity="0.2"/>

  <circle r="2.6" fill="#5AE9C8">
    <animateMotion dur="3.8s" repeatCount="indefinite" path="M626,112 L626,212"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <g>
    <rect class="node" x="566" y="86" width="120" height="26" rx="6"/>
    <text class="node-label mono" x="626" y="103" text-anchor="middle">REQUEST</text>

    <rect class="node-hot" x="536" y="140" width="180" height="34" rx="8"/>
    <text class="node-label-hot mono" x="626" y="161" text-anchor="middle">AGENT RUNTIME</text>

    <rect class="node" x="526" y="212" width="60" height="22" rx="6"/>
    <text class="node-label mono" x="556" y="227" text-anchor="middle">LLM</text>

    <rect class="node" x="596" y="212" width="60" height="22" rx="6"/>
    <text class="node-label mono" x="626" y="227" text-anchor="middle">TOOLS</text>

    <rect class="node" x="666" y="212" width="60" height="22" rx="6"/>
    <text class="node-label mono" x="696" y="227" text-anchor="middle">MEMORY</text>
  </g>

  <circle cx="550" cy="157" r="2.6" fill="#5AE9C8" opacity="0.9"/>
  <circle cx="550" cy="157" r="2.6" fill="none" stroke="#5AE9C8" stroke-opacity="0.4">
    <animate attributeName="r" values="3;8" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.4;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  </g>
</svg>
